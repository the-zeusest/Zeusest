<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeusest Animal Playlist</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <p class="eyebrow">Walt Rizney</p>
          <h1>Animal Playlist</h1>
        </div>
        <div class="meta-chip"><span id="song-count">0</span> tracks</div>
      </header>

      <section class="player-card">
        <div id="player" aria-label="YouTube player"></div>
        <div id="now-playing">Select an animal to play a track.</div>
      </section>

      <div id="animal-grid" class="animal-grid" aria-live="polite"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="./src/animalSongs.js"></script>
  </body>
</html>
